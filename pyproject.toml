[project]
name = "shurly"
version = "0.1.0"
description = "A modern URL shortener built with FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 5.0 removes the silent 72-byte truncation passlib relied on; pin to 4.x
    # until passlib ships an upstream fix.
    "bcrypt<5",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    # Phase 3.14.1 — schema migrations, run at startup (server/core/migrations.py).
    # Capped below 2 for the same reason as fastmcp: no committed uv.lock.
    "alembic>=1.13,<2",
    # Phase 3.13.2 — verifies Google's ID token (signature, aud, iss, exp) for
    # sign in with Google (server/utils/google_oidc.py). Capped like alembic.
    "google-auth>=2.40,<3",
    # Phase 3.12 — the time zones and countries a profile may name
    # (server/utils/timezones.py): one list everywhere, where the system's varies
    # (Debian's lacks the legacy names browsers still report). A floor, not a pin.
    "tzdata>=2025.2",
    # Phase 3.12 — decodes an uploaded avatar and re-encodes it without metadata
    # (server/utils/avatar.py). It parses untrusted input: watch its CVEs, and keep
    # the floor above the last fixed one (11.3.0, CVE-2025-48379).
    "pillow>=11.3",
    # Phase 8.4 — reads DB-IP's IP to Country Lite database (server/utils/geo.py), memory-
    # mapped, in process. Capped like alembic: there's no committed uv.lock.
    "maxminddb>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    # Pinned to one minor series: CI now fails on lint/format, and a new ruff
    # minor can add rules or change formatting. uv.lock isn't committed, so an
    # open range would let an upgrade turn CI red with no code change. Bump
    # deliberately (and re-run `ruff format .` in the same PR).
    "ruff>=0.15.12,<0.16",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.26.0",
    # Phase 8.4 — writes the tiny geolocation databases the tests read (tests/test_geolocation.py).
    "mmdb-writer>=0.2.7,<0.3",
]
# Phase 5 — MCP server. Optional so it doesn't bloat the production image
# unless deliberately enabled. Install with `uv sync --extra mcp` for local
# development of the MCP transport surface.
# fastmcp 4 moved its HTTP stack to httpx2 (see mcp_server/auth.py). Capped
# below 5 because uv.lock is not committed: every CI run and deploy resolves
# the newest release, so an unbounded spec lets a new major land unreviewed.
# At least 4.0.6 (Phase 5.8): from there fastmcp's GoogleTokenVerifier sends
# Google's token to tokeninfo in the Authorization header, not the URL
# (PrefectHQ/fastmcp#5185), which is the version 5.8 was built and tested on.
mcp = [
    "fastmcp>=4.0.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "TID251",  # banned APIs, below
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# requires-python is >=3.10 and CI runs 3.10: keep target-version at py310, so pyupgrade
# (UP017) never suggests what 3.10 lacks.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.UTC".msg = "Python 3.10 has no datetime.UTC (added in 3.11): use datetime.timezone.utc"

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    # Skip macOS / iCloud sync conflict copies (e.g. "test_urls 2.py").
    "--ignore-glob=*[0-9].py",
    "--ignore-glob=tests/*backup*",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
