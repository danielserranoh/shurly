name: Deploy Frontend to S3 + CloudFront

# Phase 4.10 — the static build (frontend/dist/) goes to a private S3 bucket behind the
# CloudFront distribution of shurly.griddo.io (DEPLOYMENT.md § Frontend hosting).
# Runs on merges to main that touch the frontend, and by hand. Until the AWS side exists
# (the FRONTEND_BUCKET variable is unset), it says it skipped and stops there.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# OIDC: the runner assumes AWS_FRONTEND_DEPLOY_ROLE_ARN (its own, least-privilege role).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: eu-south-2

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is the AWS side set up?
        id: check
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          if [ -z "$FRONTEND_BUCKET" ]; then
            echo "::notice title=Frontend deploy skipped::frontend deploy skipped: FRONTEND_BUCKET unset"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        env:
          # Phase 4.10's production values: the app and the API share shurly.griddo.io. Short
          # links show on the repository variable PUBLIC_SHORT_DOMAIN's host, go.griddo.io while
          # it's unset (DEPLOYMENT.md § The cutover). The MCP address in the manual and Settings
          # derives as https://shurly.griddo.io/mcp/.
          PUBLIC_API_URL: https://shurly.griddo.io
          PUBLIC_SITE_URL: https://shurly.griddo.io
          PUBLIC_SHORT_DOMAIN: ${{ vars.PUBLIC_SHORT_DOMAIN || 'go.griddo.io' }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the hashed assets, cached for good
        # Astro fingerprints everything under _astro/, so a file there never changes in
        # place. First, so the new pages find them; without --delete, so pages still open
        # in someone's browser keep finding the old ones.
        run: |
          aws s3 sync frontend/dist/_astro "s3://$BUCKET/_astro" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload the pages and the rest, always revalidated
        # HTML, favicons, og-image.png, site.webmanifest, brand/: names without a hash,
        # so browsers check for a newer version every time (cheap: S3 answers with an ETag).
        # --delete removes pages that are gone; _astro/ is excluded, so it's never pruned.
        run: |
          aws s3 sync frontend/dist "s3://$BUCKET" \
            --exclude "_astro/*" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate"
          # Older AWS CLI builds don't know .webmanifest and store it as binary/octet-stream.
          aws s3 cp frontend/dist/site.webmanifest "s3://$BUCKET/site.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        if: env.DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: No distribution to invalidate
        if: env.DISTRIBUTION_ID == ''
        run: echo "::warning title=No invalidation::CLOUDFRONT_DISTRIBUTION_ID unset, so CloudFront may serve cached pages until they expire"

      - name: Summary
        run: |
          echo "Frontend deployed to s3://$BUCKET ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
