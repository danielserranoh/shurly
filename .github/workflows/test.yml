name: Tests

on:
  push:
    branches: [main, dev, 'feat/**', 'claude/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    # Phase 3.14.1 — the migration tests need a real PostgreSQL (DDL, enum
    # types, advisory locks). Same major version as production's RDS.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies (dev + mcp extras)
      # ruff and pytest live in the [dev] optional-dependencies group; without
      # --extra dev `uv sync` skips them and the lint step fails to spawn ruff.
      # --extra mcp pulls fastmcp so the Phase 5 / Phase 5.5 tests don't get
      # silently skipped via `pytest.importorskip("fastmcp")`.
      # --locked: exactly uv.lock, and a failure if pyproject.toml changed without it (`uv lock`).
      run: |
        uv sync --locked --extra dev --extra mcp

    - name: Lint with ruff
      # Gating. The codebase was brought to zero lint errors and fully
      # formatted in one cleanup PR (27 Sep 2026); keep it there. Locally:
      # `uv run ruff check . && uv run ruff format --check .`
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run tests
      # --require-mcp errors out if fastmcp is missing, instead of letting the
      # MCP suites skip and hide a failure (see tests/conftest.py).
      # --require-postgres does the same for the migration tests.
      env:
        TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      run: |
        uv run pytest --require-mcp --require-postgres --cov=server --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.10'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # The whole suite on PostgreSQL, as production runs. The job above runs it on SQLite, which takes
  # what PostgreSQL refuses (a GROUP BY on a json column, a NUL character in text), so a 500 only
  # PostgreSQL gives would pass there. tests/conftest.py makes the run a database of its own.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies (dev + mcp extras)
      run: |
        uv sync --locked --extra dev --extra mcp

    - name: Run the suite on PostgreSQL
      env:
        TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        TEST_SUITE_ON_POSTGRES: "1"
      run: |
        uv run pytest --require-mcp --require-postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Frontend unit tests
      # node --test runs the TypeScript modules as they are (Node 22.18+).
      working-directory: frontend
      run: npm test

    - name: Type-check and build the frontend
      # astro check + astro build: what the deploy runs, so a PR can't break it unseen.
      working-directory: frontend
      run: npm run build

  # Phase 6.1 — the end-to-end tests (frontend/e2e/): the production build in Chromium, which enforces the pages'
  # Trusted Types, against the real API with a fake Google (tests/e2e/app.py) on its own PostgreSQL. A test fails
  # on a CSP or Trusted Types violation, an uncaught error, a 5xx, or a request to any other host.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shurly_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The API's database: the wrapper refuses to start on one that isn't local.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shurly_e2e

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      # The production image's version (dockerfile).
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install the API's dependencies
      # The app's own, as the image has them: the wrapper and the fake Google need no extra.
      run: uv sync --locked

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Cache Playwright's Chromium
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: frontend
      run: npx playwright install --with-deps --only-shell chromium

    - name: Install Chromium's system libraries
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      working-directory: frontend
      run: npx playwright install-deps chromium

    - name: End-to-end tests
      # Builds the frontend for the test API, starts both, then runs e2e/ (playwright.config.ts).
      working-directory: frontend
      run: npm run e2e

    - name: Upload the report, the traces and the API's log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
          frontend/e2e/.logs/
        retention-days: 7

  test-summary:
    runs-on: ubuntu-latest
    needs: [test, test-postgres, frontend, e2e]
    if: always()
    steps:
    - name: Test Summary
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.test-postgres.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ] && [ "${{ needs.e2e.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Tests failed!"
          exit 1
        fi
