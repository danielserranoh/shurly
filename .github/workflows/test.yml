name: Tests

on:
  push:
    branches: [main, dev, 'feat/**', 'claude/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    # Phase 3.14.1 — the migration tests need a real PostgreSQL (DDL, enum
    # types, advisory locks). Same major version as production's RDS.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies (dev + mcp extras)
      # ruff and pytest live in the [dev] optional-dependencies group; without
      # --extra dev `uv sync` skips them and the lint step fails to spawn ruff.
      # --extra mcp pulls fastmcp so the Phase 5 / Phase 5.5 tests don't get
      # silently skipped via `pytest.importorskip("fastmcp")`.
      run: |
        uv sync --extra dev --extra mcp

    - name: Lint with ruff
      # Gating. The codebase was brought to zero lint errors and fully
      # formatted in one cleanup PR (27 Sep 2026); keep it there. Locally:
      # `uv run ruff check . && uv run ruff format --check .`
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run tests
      # --require-mcp errors out if fastmcp is missing, instead of letting the
      # MCP suites skip and hide a failure (see tests/conftest.py).
      # --require-postgres does the same for the migration tests.
      env:
        TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      run: |
        uv run pytest --require-mcp --require-postgres --cov=server --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.10'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Frontend unit tests
      # node --test runs the TypeScript modules as they are (Node 22.18+).
      working-directory: frontend
      run: npm test

    - name: Type-check and build the frontend
      # astro check + astro build: what the deploy runs, so a PR can't break it unseen.
      working-directory: frontend
      run: npm run build

  test-summary:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: always()
    steps:
    - name: Test Summary
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Tests failed!"
          exit 1
        fi
