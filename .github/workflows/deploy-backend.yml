name: Deploy Backend to ECS

# Auto-deploy on every merge to main. Branch protection on main requires PR +
# passing tests, so by the time a commit lands here the deploy gate has already
# been crossed. workflow_dispatch is preserved for manual deploys (rollback,
# debugging, deploying to a non-prod env when we add one).
#
# Phase 8.4 — and every Monday: MaxMind's GeoLite2 licence wants the copy the image carries
# replaced within 30 days of an update. A scheduled run rebuilds main's current commit, as it
# stands (the default branch is main), with this week's databases, and deploys it: the smoke
# test still checks it's that commit. DEPLOYMENT.md § Geolocation data.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

# OIDC needs id-token: write so the runner can assume the IAM role in AWS
# without long-lived access keys. We use SSO locally and OIDC in CI; access
# keys never enter the picture.
permissions:
  id-token: write
  contents: read

# One deploy at a time: a scheduled run and a push to main rolling out side by side could land
# the older commit last. A run waits for the one in progress; a newer run replaces a waiting one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: eu-south-2
  ECR_REPOSITORY: shurly-api
  ECS_SERVICE_NAME: shurly-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Run the test suite before pushing anything to AWS. If tests fail, no
      # bad image lands in ECR and the running service stays untouched.
      # --require-mcp: the image ships the [mcp] extra, so its tests must run.
      - name: Install deps + run tests
        run: |
          # Exactly uv.lock: what the PR's CI tested, and what the image installs (`--frozen`).
          uv sync --locked --extra dev --extra mcp
          uv run pytest -q --require-mcp

      - name: Configure AWS credentials (OIDC)
        # The role lives in griddo-main and is created one-time via the
        # commands documented in DEPLOYMENT.md ("CI/CD with OIDC"). Trust
        # policy scopes assumption to this exact repo + branch pattern.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-shurly-deploy

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Geolocation data (Phase 8.4)
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          # The image's geoip stage fetches MaxMind's GeoLite2 City (with these build secrets,
          # never in a layer or this log) and DB-IP's countries, and the build below reuses it
          # from this builder's cache, the same run. The fetch never fails the build, so it's
          # checked here: without GeoLite2 there are no cities, and a scheduled run that ships
          # no fresh copy would leave last week's to age past MaxMind's 30 days.
          docker buildx build --target geoip-data --output type=local,dest=geoip-data \
            --secret id=maxmind_account_id,env=MAXMIND_ACCOUNT_ID \
            --secret id=maxmind_license_key,env=MAXMIND_LICENSE_KEY \
            --build-arg GEOIP_REFRESH="$GITHUB_RUN_ID" .
          if [ -n "$MAXMIND_LICENSE_KEY" ] && [ ! -s geoip-data/GeoLite2-City.mmdb ]; then
            echo "::error title=No GeoLite2 City::MaxMind's database couldn't be fetched (scripts/fetch_geoip.py prints why, above). Nothing is deployed."
            exit 1
          fi
          if [ -z "$MAXMIND_LICENSE_KEY" ]; then
            echo "::warning title=No MaxMind credentials::MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY aren't set: countries only, from DB-IP, and no cities."
          fi
          if [ ! -s geoip-data/dbip-country-lite.mmdb ]; then
            echo "::warning title=No DB-IP fallback::The image ships without DB-IP's country database, the fallback (scripts/fetch_geoip.py)."
          fi

      - name: Build and push image (multi-arch)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          # Tag = <short-sha>-<run-id>. Short SHA keeps it traceable to the
          # source commit; run id makes the tag unique per workflow run so
          # retries don't collide with the IMMUTABLE ECR repo. Mirrors the
          # convention used by scripts/deploy_ecs.sh.
          SHORT_SHA="${GITHUB_SHA::8}"
          IMAGE_TAG="${SHORT_SHA}-${GITHUB_RUN_ID}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          # Multi-arch (amd64 + arm64). ECS Fargate currently runs x86_64 by
          # default, so an arm64-only image fails to pull. Building both keeps
          # the manifest portable. Cf. lessons in docs/AWS_ECS_DEPLOYMENT.md.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_ID="$GITHUB_RUN_ID" \
            --build-arg GEOIP_REFRESH="$GITHUB_RUN_ID" \
            --secret id=maxmind_account_id,env=MAXMIND_ACCOUNT_ID \
            --secret id=maxmind_license_key,env=MAXMIND_LICENSE_KEY \
            --tag "$IMAGE_URI" \
            --push \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Roll out new image to ECS Express
        # update-express-gateway-service triggers Express Mode's blue/green
        # deploy. The ecs-alb-rule-sync Lambda (Phase 4.7) follows the active
        # target group automatically — no manual intervention needed.
        run: |
          SERVICE_ARN=$(aws ecs list-services --cluster default \
            --query "serviceArns[?contains(@, '${ECS_SERVICE_NAME}')] | [0]" \
            --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "::error::Service ${ECS_SERVICE_NAME} not found. Run scripts/deploy_ecs.sh manually for the first-time create."
            exit 1
          fi

          # Each step runs in its own shell, so the next step can only see this
          # through GITHUB_ENV. Without it the wait step polled an empty ARN and
          # reported `status=unknown` on every deploy since the pipeline existed.
          echo "SERVICE_ARN=$SERVICE_ARN" >> "$GITHUB_ENV"

          # Pull the existing primary container, mutate only the image, and
          # send it back. Avoids overwriting any env-var changes someone may
          # have applied via the console.
          #
          # It lives under activeConfigurations: `service.primaryContainer` is
          # null for Express services. Until 28 Sep 2026 this read that null, so
          # the masking below masked nothing and the update sent the image alone
          # (Express kept the rest, which is why deploys still worked). During a
          # rollout there are two active configurations, the old and the new, in
          # no promised order: take the newest, or a deploy right after a settings
          # change would put the old settings back. Stop rather than send a
          # container without its settings.
          CURRENT_CONTAINER=$(aws ecs describe-express-gateway-service \
            --service-arn "$SERVICE_ARN" --output json \
            | jq '.service.activeConfigurations | max_by(.createdAt) | .primaryContainer')
          if [ -z "$(echo "$CURRENT_CONTAINER" | jq -r '.image // empty')" ] \
             || [ "$(echo "$CURRENT_CONTAINER" | jq '[.environment[]?] | length')" -eq 0 ]; then
            echo "::error::No container config (image and environment) found for $SERVICE_ARN"
            exit 1
          fi

          # The container config carries plain env vars, credentials included
          # (DB_PASSWORD). GitHub only masks values registered as GitHub
          # secrets, so mask anything credential-shaped ourselves before any
          # later line could print it. Defence in depth: nothing below should.
          echo "$CURRENT_CONTAINER" \
            | jq -r '.environment[]? | select(.name | test("PASS|SECRET|TOKEN|KEY|CREDENTIAL"; "i")) | .value' \
            | while IFS= read -r v; do if [ -n "$v" ]; then echo "::add-mask::$v"; fi; done

          UPDATED_CONTAINER=$(echo "$CURRENT_CONTAINER" | \
            jq --arg img "$IMAGE_URI" '.image = $img')

          # The wait step uses this to tell the deployment we're about to create
          # from the previous one, which also reads PRIMARY/COMPLETED.
          echo "DEPLOY_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

          # NEVER let this print its response. It echoes the full container
          # config, env vars and all — this repo is public, and the default
          # output published the production DB password in three deploy logs
          # (22-26 Sep 2026) before it was caught.
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --primary-container "$UPDATED_CONTAINER" \
            > /dev/null

          echo "Deploy initiated for $IMAGE_URI"

      - name: Wait for the rollout to complete
        # ECS Express rolls out as a CANARY: 5% of traffic for 3 min, then 100%,
        # then a 3 min bake — ~10-12 min end to end. Poll the ECS *deployment*:
        # the service status reads ACTIVE throughout, which is why the old check
        # passed on its first attempt without waiting for anything.
        # Gating: a FAILED rollout (circuit breaker rolled back) fails the job.
        run: |
          for i in $(seq 1 100); do
            read -r STATE CREATED <<<"$(aws ecs describe-services --cluster default \
              --services "$ECS_SERVICE_NAME" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[rolloutState, createdAt]" \
              --output text)"
            # 30 s of slack for clock skew between the runner and AWS.
            IS_NEW=$(python3 -c "import sys,datetime; print(int(datetime.datetime.fromisoformat(sys.argv[1]).timestamp() >= int(sys.argv[2]) - 30))" "$CREATED" "$DEPLOY_STARTED" 2>/dev/null || echo 0)
            echo "[$i/100] primary deployment: $STATE (new: $IS_NEW)"
            if [ "$IS_NEW" = "1" ] && [ "$STATE" = "COMPLETED" ]; then
              echo "✓ Rollout completed"
              exit 0
            fi
            if [ "$IS_NEW" = "1" ] && [ "$STATE" = "FAILED" ]; then
              echo "::error::The ECS deployment FAILED and was rolled back. Check the service events in the ECS console."
              exit 1
            fi
            sleep 15
          done
          echo "::error::The rollout did not complete within 25 min."
          exit 1

      - name: Smoke test the public host
        # shurly.griddo.io is served by a custom ALB rule (priority 12) that Express
        # doesn't manage; the ecs-alb-rule-sync Lambda copies Express's weights
        # onto it (infra/ecs-alb-rule-sync). Until 27 Sep 2026 it did so only on
        # COMPLETED, ~1 min after ECS had stopped the old task, so the ALB
        # answered 503 in between and the public host never got the canary.
        # It now follows the rollout from IN_PROGRESS, so the switch should
        # already have happened when this runs. The retries stay as a margin.
        # A 200 alone proves nothing (the old image answers 200 too); wait for
        # /health to report the commit we just built, and this run's build: the
        # weekly run (Phase 8.4) rebuilds the commit that's already serving.
        run: |
          PUBLIC_HOST="shurly.griddo.io"
          echo "Waiting for https://${PUBLIC_HOST}/api/v1/health to report commit ${GITHUB_SHA::8}, build ${GITHUB_RUN_ID}"
          for i in $(seq 1 30); do
            HEALTH=$(curl -sS --max-time 10 "https://${PUBLIC_HOST}/api/v1/health" 2>/dev/null) || HEALTH='{"commit": "unreachable"}'
            SERVING=$(echo "$HEALTH" | jq -r '.commit // "none"' 2>/dev/null || echo "unreachable")
            BUILD=$(echo "$HEALTH" | jq -r '.build // "none"' 2>/dev/null || echo "unreachable")
            if [ "$SERVING" = "$GITHUB_SHA" ] && [ "$BUILD" = "$GITHUB_RUN_ID" ]; then
              echo "✓ New image is serving (attempt $i)"
              exit 0
            fi
            echo "[$i/30] serving: ${SERVING::11}, build ${BUILD} — waiting for ${GITHUB_SHA::8}, build ${GITHUB_RUN_ID}"
            sleep 10
          done
          echo "::error::The rollout completed, but 5 min later ${PUBLIC_HOST} still serves ${SERVING::11} (build ${BUILD}), not ${GITHUB_SHA::8} (build ${GITHUB_RUN_ID}). The public-host rule (priority 12) was not synced — check the ecs-alb-rule-sync Lambda's logs."
          exit 1
