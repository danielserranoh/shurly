# The weekly bump (DEPLOYMENT.md § Workflow trigger): uv.lock is committed, so new versions arrive only here,
# as PRs against dev that CI runs and the coordinator QAs. Minor and patch updates come grouped, one PR per
# ecosystem; a major is a PR of its own. pyproject.toml's caps keep a bump below the majors they name.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
