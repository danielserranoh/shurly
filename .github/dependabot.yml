# The weekly bump (DEPLOYMENT.md § Workflow trigger): uv.lock is committed, so new versions arrive only here,
# as PRs against dev that CI runs and the coordinator QAs. Python's minor and patch updates come grouped, and
# a Python major is a PR of its own; the workflows' actions come in one PR, majors included. pyproject.toml's
# caps keep a bump below the majors they name.
# The dockerfile's images are pinned by digest: the base image's digest moves weekly, but a new Python or a
# new uv is a change of its own (uv's version is in the workflows too: bump them together, and re-lock).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      # Every action's update in one weekly PR, majors included: they're rarely more than a new Node
      # runtime, and one PR's CI checks them together (the first run opened six, #175–#180).
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
    ignore:
      - dependency-name: "ghcr.io/astral-sh/uv"
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
